{% extends "base.html" %}{% block body %}
<h1>Your claims</h1><p>Signed in as {{ user }}.</p>
<table><tr><th>#</th><th>Merchant</th><th>Amount</th><th>Status</th></tr>
{% for c in claims %}<tr><td><a href="/claim/{{ c['id'] }}">{{ c['id'] }}</a></td>
<td>{{ c['merchant'] }}</td><td>&euro;{{ c['amount'] }}</td><td>{{ c['status'] }}</td></tr>{% endfor %}</table>
<h2>New claim</h2>
<form method="post" action="/claim/new"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<p><input name="merchant" placeholder="Merchant" maxlength="120" required>
<input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required></p>
<p><textarea name="note" placeholder="Note" maxlength="2000"></textarea></p>
<p><button type="submit">Submit</button></p></form>{% endblock %}
